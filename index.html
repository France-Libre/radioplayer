<!-- Multi Radio Player - maintenant avec mise à jour automatique du Now Playing -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FM Libre - France Libre</title>
  <style>
    :root{
        --bg:#000;
        --card:#111;
        --muted:#9aa0a6;
        --accent1:#00BBFF;
        --accent2:#FF8000;
        --glass: rgba(255,255,255,0.05);
        --radius:14px;
        --gap:18px;
        font-family:"Be Vietnam Pro", system-ui, sans-serif;
    }

    html, body {
        margin:0;
        background: var(--bg);
        color:#fff;
        font-family:inherit;
    }

    .wrap{
        max-width:1100px;
        margin:0 auto;
        padding: 0 2rem;
        display:flex;
        flex-wrap:wrap;
        gap:var(--gap);
    }

    /* CSS du Header */
    nav {
        background: rgba(10, 10, 10, 0.8);
        backdrop-filter: blur(10px);
        padding: 1rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        margin-bottom: 2rem;
    }

    .nav-left {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }

    .nav-left img {
        width: 40px;
        height: 28px;
        object-fit: cover;
        border-radius: 2px;
    }

    .nav-title h1 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
        letter-spacing: -0.02em;
    }

    .nav-title p {
        font-size: 0.7rem;
        color: #666;
        font-weight: 300;
        margin-top: 0.1rem;
    }

    /* Responsive Nav */
    @media (max-width: 968px) {
        nav {
            padding: 1rem 1.5rem;
        }
    }

    header{
        width:100%;
        display:flex;
        flex-wrap:wrap;
        justify-content:space-between;
        align-items:center;
        gap:12px;
        margin-bottom:24px;
    }

    .brand h1{ 
        margin:0; 
        font-size:2rem; 
        font-weight: 700;
        letter-spacing:-0.02em;
        background: linear-gradient(135deg, #00BBFF, #FF8000);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .brand p{ 
        margin:0; 
        color:rgba(255, 255, 255, 0.4); 
        font-size:1rem;
        font-weight: 300;
    }

    .left{
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius:12px;
        padding:1.5rem;
        display:flex;
        flex-direction:column;
        gap:16px;
        min-width:280px;
        flex:1;
        transition: all 0.3s;
    }

    .station-list{
        display:flex;
        flex-direction:column;
        gap:10px;
        overflow:auto;
        padding-right:4px;
        max-height:60vh;
    }

    /* Scrollbar custom */
    .station-list::-webkit-scrollbar {
        width: 6px;
    }

    .station-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
    }

    .station-list::-webkit-scrollbar-thumb {
        background: rgba(0, 187, 255, 0.3);
        border-radius: 10px;
    }

    .station{
        display:flex;
        align-items:center;
        gap:12px;
        padding:10px;
        border-radius:10px;
        cursor:pointer;
        transition: all 0.2s ease;
        background: transparent;
    }

    .station:hover{
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(0, 187, 255, 0.2);
        transform: translateX(3px);
    }

    .station.active{
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(0, 187, 255, 0.4);
    }

    .logo{ 
        width:48px; 
        height:48px; 
        border-radius:8px; 
        background: rgba(255, 255, 255, 0.05); 
        display:flex; 
        align-items:center; 
        justify-content:center; 
        overflow:hidden;
        flex-shrink: 0;
    }

    .logo img{ 
        width:100%; 
        height:100%; 
        object-fit:cover; 
    }

    .meta{ 
        flex:1; 
        min-width:0; 
    }

    .meta .name{ 
        font-weight:600;
        font-size: 1rem;
        color: #fff;
    }

    .meta .desc{ 
        font-size:0.85rem; 
        color:rgba(255, 255, 255, 0.4); 
        white-space:nowrap; 
        overflow:hidden; 
        text-overflow:ellipsis;
        font-weight: 300;
    }

    .controls{ 
        display:flex; 
        gap:10px; 
        align-items:center; 
    }

    .btn{ 
        background:transparent; 
        border:0; 
        color:rgba(255, 255, 255, 0.6); 
        padding:8px; 
        border-radius:10px; 
        cursor:pointer;
        transition: all 0.2s;
        font-family: inherit;
    }

    .btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
    }

    .btn.primary{ 
        background: linear-gradient(135deg, #00D4FF 0%, #FF6B35 50%, #FFB84D 100%);
        color:white; 
        font-weight:600;
    }

    .right {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius:12px;
        padding:1.5rem;
        display:flex;
        flex-direction:column;
        align-items:center;
        flex:2;
        min-height: 500px;
    }

    .player-card {
        display:flex;
        flex-direction:column;
        align-items:center;
        width:100%;
        flex: 1;
        justify-content: center;
    }

    .now-radio-info{
        position:relative;
        display:flex;
        flex-direction:column;
        align-items:center;
        width:100%;
    }

    .radio-logo-name{
        position:absolute;
        top:12px;
        left:12px;
        display:flex;
        align-items:center;
        gap:8px;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(10px);
        padding:6px 12px;
        border-radius:10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .radio-logo-name img{
        width:32px;
        height:32px;
        border-radius:6px;
        object-fit:cover;
    }

    .radio-logo-name span{
        font-weight:600;
        font-size:14px;
    }

    #nowArtwork{
        width:90%;
        max-width:320px;
        aspect-ratio:1/1;
        border-radius:12px;
        object-fit:cover;
        margin-top:24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .song-info{
        text-align:center;
        margin-top:20px;
        word-break: break-word;
    }

    .song-info h2{ 
        font-size:1.5rem; 
        margin:8px 0;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .song-info p{ 
        font-size:1rem; 
        color:rgba(255, 255, 255, 0.5); 
        margin:4px 0;
        font-weight: 300;
    }

    .player-controls{
        display:flex;
        gap:16px;
        margin-top:24px;
        align-items:center;
        flex-wrap:wrap;
        justify-content:center;
    }

    .big-play{
        width:64px; 
        height:64px; 
        border-radius:50%; 
        border:0;
        display:grid; 
        place-items:center;
        font-size:20px;
        background: linear-gradient(135deg, #00D4FF 0%, #FF6B35 50%, #FFB84D 100%);
        color:#fff;
        cursor:pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
    }

    .big-play:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 24px rgba(0, 212, 255, 0.5);
    }

    .vol{ 
        display:flex; 
        align-items:center; 
        gap:10px;
        background: rgba(255, 255, 255, 0.02);
        padding: 8px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    input[type=range]{ 
        -webkit-appearance:none; 
        height:6px; 
        border-radius:6px; 
        background:rgba(255,255,255,0.1); 
        width:120px;
        cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb{ 
        -webkit-appearance:none; 
        width:16px; 
        height:16px; 
        border-radius:50%; 
        background: linear-gradient(135deg, #00BBFF, #FF8000);
        box-shadow:0 2px 8px rgba(0, 187, 255, 0.4);
        cursor: pointer;
    }

    input[type=range]::-moz-range-thumb {
        width:16px; 
        height:16px; 
        border-radius:50%; 
        background: linear-gradient(135deg, #00BBFF, #FF8000);
        border: none;
        cursor: pointer;
    }

    footer.small{
        width:100%;
        color:rgba(255, 255, 255, 0.3);
        font-size:0.85rem;
        display:flex;
        justify-content:space-between;
        flex-wrap:wrap;
        margin-top:auto;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-weight: 300;
    }

    footer.small a{
        text-decoration:none;
        color:#00BBFF;
        transition: 0.2s;
        font-weight: 400;
    }

    footer.small a:hover{
        color:#FF8000;
        transition: 0.2s;
    }

    .hidden{
        display:none !important;
    }

    .player-empty{
        height:320px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:1.3rem;
        font-weight:500;
        color:rgba(255, 255, 255, 0.3);
        text-align:center;
    }

    .player-empty p{
        margin:0;
    }

    @media (max-width:1024px){
        .wrap{ 
            flex-direction:column; 
            padding: 0 1rem;
        }
        .left, .right{ 
            width:100%; 
        }
    }

    @media (max-width:600px){
        #nowArtwork{ 
            max-width:240px; 
        }
        .song-info h2{ 
            font-size:1.2rem; 
        }
        .song-info p{ 
            font-size:0.9rem; 
        }
        .player-controls{ 
            flex-direction:column; 
            gap:12px; 
        }
        .brand h1 {
            font-size: 1.5rem;
        }
        .wrap {
            padding: 0 1rem;
        }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>La FM Libre</h1>
        <p>Les webradios de France Libre.</p>
      </div>
      <div style="margin-left:auto;color:var(--muted)">Press play, be chill.</div>
    </header>

    <div class="left">
      <div style="font-size:13px;color:var(--muted);">Stations</div>
      <div class="station-list" id="stationList"></div>
      <div style="margin-top:auto; display:flex; gap:8px; align-items:center; justify-content:space-between">
        <small style="color:var(--muted)">Lecteur partageable • 1 flux à la fois</small>
        <button class="btn" id="stopAll">Arrêter</button>
      </div>
    </div>

    <div class="right">
      <div class="player-card">
        <div class="logo" id="nowLogo"><img src="" alt="logo"/></div>
        <div class="player-info">
          <h2 id="nowName">Sélectionne une station</h2>
          <p id="songTitle"></p>
          <p id="songArtist"></p>
        </div>
        <div class="big-controls">
          <button class="btn big-play primary" id="playToggle" aria-label="Play">▶</button>
          <div class="vol">
            <button class="btn" id="muteBtn">🔊</button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>
      <footer class="small">
        <span>FM Libre - Codé avec coeur pour la France Libre</span>
        <span id="debug"></span>
      </footer>
    </div>
  </div>

  <audio id="player" crossorigin="anonymous"></audio>

  <script>
    const stations = [
      { id: 'r1', name: 'Espace Normandie Picardie', logo: 'assets/espace.png', stream: 'https://radios.francodie.com/listen/espace_192k/radio.mp3', api: 'https://radios.francodie.com/api/nowplaying/1' },
      { id: 'r2', name: 'NRJ France Libre', logo: 'assets/nrj.png', stream: 'https://radios.frlibre.fr/listen/nrj/radio.mp3', api: 'https://radios.frlibre.fr/api/nowplaying/3' },
      { id: 'r3', name: 'Radio Armorique', logo: 'assets/armorik.png', stream: 'https://radios.frlibre.fr/listen/armorik/radio.mp3', api: 'https://radios.frlibre.fr/api/nowplaying/4' },
      { id: 'r4', name: 'RF1', logo: 'https://radios.frlibre.fr/static/uploads/vradio/album_art.1759323847.png', stream: 'https://radios.frlibre.fr/listen/vradio/radio.mp3', api: 'https://radios.frlibre.fr/api/nowplaying/7' },
      { id: 'r5', name: 'CR1', logo: 'https://radios.frlibre.fr/static/uploads/cr1/album_art.1757760077.webp', stream: 'https://radios.frlibre.fr/listen/cr1/radio.mp3', api: 'https://radios.frlibre.fr/api/nowplaying/8' },
      { id: 'r6', name: 'FréquenceGood', logo: 'assets/frequencegood.png', stream: 'https://radios.francodie.com/listen/frequencegood/radio.mp3', api: 'https://radios.francodie.com/api/nowplaying/9' },
      { id: 'r7', name: 'Breizh 1', logo: 'https://radios.frlibre.fr/static/uploads/bzh1/album_art.1759653562.png', stream: 'https://radios.francodie.com/listen/bzh1/radio.mp3', api: 'https://radios.francodie.com/api/nowplaying/11' }
    ];

    const stationList = document.getElementById('stationList');
    const player = document.getElementById('player');
    const nowLogo = document.getElementById('nowLogo').querySelector('img');
    const nowName = document.getElementById('nowName');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const playToggle = document.getElementById('playToggle');
    const muteBtn = document.getElementById('muteBtn');
    const volume = document.getElementById('volume');
    const stopAll = document.getElementById('stopAll');
    const debug = document.getElementById('debug');

    let currentStation = null;
    let isPlaying = false;
    let nowPlayingInterval = null;

    function createStationNode(s){
      const el = document.createElement('div');
      el.className = 'station';
      el.dataset.id = s.id;
      el.innerHTML = `
        <div class="logo"><img src="${s.logo}" alt="${s.name} logo"/></div>
        <div class="meta">
          <div class="name">${s.name}</div>
          <div class="desc" id="desc-${s.id}">En attente...</div>
        </div>
        <div class="controls">
          <button class="btn play-small">▶</button>
        </div>
      `;
      el.querySelector('.play-small').addEventListener('click', (ev)=>{ ev.stopPropagation(); selectStation(s.id,true); });
      el.addEventListener('click', ()=> selectStation(s.id));
      return el;
    }

    function renderStations(){
      stationList.innerHTML = '';
      stations.forEach(s=> stationList.appendChild(createStationNode(s)) );
    }

    function selectStation(id, autoplay=false){
      const s = stations.find(x=>x.id===id);
      if(!s) return;
      currentStation = s;
      nowLogo.src = s.logo;
      nowName.textContent = s.name;
      songTitle.textContent = '';
      songArtist.textContent = '';
      document.querySelectorAll('.station').forEach(n=> n.classList.toggle('active', n.dataset.id===id));
      if(player.src !== s.stream){ player.src = s.stream; player.crossOrigin='anonymous'; }
      if(autoplay) play();
    }

    function fetchNowPlaying(){
      stations.forEach(st=>{
        if(!st.api) return;
        fetch(st.api).then(res=>res.json()).then(data=>{
          const descEl = document.getElementById(`desc-${st.id}`);
          if(data && data.now_playing && data.now_playing.song){
            const song = data.now_playing.song;
            if(st.id === currentStation?.id){
              songTitle.textContent = song.title || 'Titre inconnu';
              songArtist.textContent = song.artist || 'Artiste inconnu';
              nowLogo.src = song.art || currentStation.logo;
            }
            if(descEl) descEl.textContent = `${song.title || 'Titre inconnu'} – ${song.artist || 'Artiste inconnu'}`;
          } else {
            if(st.id === currentStation?.id){
              songTitle.textContent = '';
              songArtist.textContent = '';
              nowLogo.src = currentStation.logo;
            }
            if(descEl) descEl.textContent = 'Pas d\'infos';
          }
        }).catch(err=>{
          console.error(err);
          const descEl = document.getElementById(`desc-${st.id}`);
          if(st.id === currentStation?.id){
            songTitle.textContent = '';
            songArtist.textContent = '';
            nowLogo.src = currentStation.logo;
          }
          if(descEl) descEl.textContent = 'Erreur API';
        });
      });
    }

    function play(){ if(!currentStation){ return; } player.play().then(()=>{ isPlaying=true; playToggle.textContent='⏸'; }).catch(console.error); }
    function pause(){ player.pause(); isPlaying=false; playToggle.textContent='▶'; }

    playToggle.addEventListener('click', ()=>{ if(!currentStation){ return; } isPlaying?pause():play(); });
    muteBtn.addEventListener('click', ()=>{ player.muted = !player.muted; muteBtn.textContent = player.muted?'🔈':'🔊'; });
    volume.addEventListener('input', ()=>{ player.volume = parseFloat(volume.value); });
    stopAll.addEventListener('click', ()=>{
      pause();
      player.src='';
      currentStation=null;
      nowLogo.src='';
      nowName.textContent='Sélectionne une station';
      songTitle.textContent='';
      songArtist.textContent='';
      document.querySelectorAll('.station').forEach(n=>n.classList.remove('active'));
    });

    player.addEventListener('waiting', ()=>{ if(currentStation) songTitle.textContent='Buffering...'; });
    player.addEventListener('playing', ()=>{ isPlaying=true; playToggle.textContent='⏸'; });
    player.addEventListener('pause', ()=>{ isPlaying=false; playToggle.textContent='▶'; });

    renderStations();
    fetchNowPlaying();
    setInterval(fetchNowPlaying, 5000);
    setInterval(()=>{ debug.textContent = currentStation? currentStation.name:''; }, 1000);

  </script>
</body>
</html>
